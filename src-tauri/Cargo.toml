[package]
name = "nesi-desk"
version = "0.1.0"
description = "Phone-powered Android desktop workspace"
authors = ["NESI"]
edition = "2021"

[lib]
name = "nesi_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
